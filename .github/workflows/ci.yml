name: Pytesting & Pylinting
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  validation:
    name: Pytesting & Pylinting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install requirements
      run: |
        pip install -r requirements.txt
        pip install -r pipeline/pipeline_requirements.txt
        pip install -r dashboard/dashboard_requirements.txt
        pip install -r daily_report/report_requirements.txt
    - name: Linting
      run: pylint --recursive=y daily_report dashboard historical_pipeline pipeline price_alerts --fail-under 8 --ignore=venv,.venv --disable=duplicate-code
    - name: Testing
      run: pytest . 
